name: Generate Pac-Man Game

on:
  schedule: # Executa automaticamente a cada 24 horas
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite iniciar manualmente
  push: # Executa sempre que fizer uma alteração na branch main
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: "lidiapcarvalho"

      # Envia o SVG gerado para a branch output
      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
